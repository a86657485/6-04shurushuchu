<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师机麦克风测试</title><link rel="stylesheet" href="/style.css?v=12"><script src="/rules.js?v=3" defer></script><script type="module" src="/teacher-microphone.mjs?v=1"></script></head><body class="microphone-window-page"><main class="microphone-window"><p class="eyebrow">教师机 · 现场实测</p><h1>麦克风授权与测试</h1><p>允许麦克风后，先安静约1.5秒，再正常说话或轻拍手。</p><div class="microphone-window-controls"><button id="helper-start" class="primary" disabled>开启麦克风</button><button id="helper-stop">停止采声</button><button id="helper-calibrate">重新校准</button></div><p id="helper-status" class="microphone-window-status" role="status">正在连接教师大屏…</p><div id="helper-lamp" class="microphone-window-lamp" aria-label="灯未亮"><span></span><b id="helper-lamp-label">灯未亮</b></div><div class="sound-meter"><i id="helper-meter"></i></div><p>相对响度：<b id="helper-level">0%</b></p><p id="helper-connection" class="note"></p><p class="note">保持此窗口打开，可以切回教师大屏。关闭窗口或停止采声会释放麦克风；声音不会录制或上传。</p><button id="helper-close">停止并关闭窗口</button></main></body></html>
