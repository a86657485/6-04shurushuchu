<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园系统探索站 · 输入输出与计算</title><link rel="stylesheet" href="/style.css?v=7"><script src="/rules.js?v=1" defer></script><script type="module" src="/app.mjs?v=8"></script></head><body>
<header class="site-head"><a class="brand" href="/">小递的校园探索站<small>六年级 · 第4课</small></a><div class="head-actions"><span id="identity"></span><button id="export" hidden>保存学习报告</button><button id="switch" hidden>切换学生</button></div></header>
<section id="login" class="welcome"><div class="welcome-copy"><p class="eyebrow">输入 · 计算 · 输出</p><h1>校园里的设备，<br>怎样知道该做什么？</h1><p>陪小递走过路口、楼道和校园入口。<br>先想一想，再亲手检验你的猜测。</p><div class="welcome-art" id="welcome-art"></div></div><form id="login-form" class="login-panel"><h2>今天，你是校园观察员</h2><p>选好班级和姓名，继续自己的探索。</p><label>班级<select id="class" required><option value="">请选择六年级班级</option></select></label><label>找姓名<input id="search" placeholder="输入姓名查找" autocomplete="off"></label><label>姓名<select id="name" required><option value="">请先选班级</option></select></label><label class="check"><input type="checkbox" id="manual">名单里没有我</label><label id="manual-box" hidden>手动填写姓名<input id="manual-name" maxlength="30" autocomplete="off"></label><p id="identity-confirm" class="note">班级和姓名将用于保存你的学习记录。</p><button class="primary" type="submit">确认身份，进入校园</button><p id="login-error" role="alert"></p><a class="subtle" href="/demo">先看看演示 →</a></form></section>
<main id="learning" hidden><div class="progress-line"><nav id="stages" aria-label="学习关卡"></nav><div><b id="points">0 积分</b><small id="sync-status" role="status"></small></div></div><div id="test-tools" class="test-tools" hidden><b>教师隔离测试 · 虚构身份</b><button id="fill-example">载入本关达标示例</button><button id="test-reset">清空测试状态</button><a href="/teacher">返回大屏</a></div>
<section id="stage-page"><div class="lesson-heading"><div><p id="chapter" class="eyebrow"></p><h1 id="stage-title"></h1><p id="stage-goal"></p></div><div class="mode-switch"><button id="mode-3d" aria-pressed="true">3D 场景</button><button id="mode-2d" aria-pressed="false">2D 简洁</button></div></div><div class="experiment-layout"><div class="experiment"><div id="scene" class="scene"></div><div id="live-status" class="scene-caption" aria-live="polite"></div><div id="controls" class="controls"></div><p id="scene-note" class="note"></p></div><aside class="task-panel"><div id="story" class="story"><b id="story-title">小递的任务</b><p id="story-text"></p><button id="scene-photo-button" class="scene-photo" type="button" aria-label="放大观察情境示意图"><img id="scene-photo" alt="" decoding="async"><span>情境示意图 · AI生成 <b>点击放大观察 ↗</b></span></button><p id="scene-observation" class="scene-observation"></p><button id="story-close" class="subtle">收起情境</button></div><button id="story-open" class="subtle" hidden>回看情境</button><div id="prediction-panel"></div><div class="evidence-head"><b>我的实验记录</b><button id="record" class="small">记录现在的结果</button></div><div id="trials" class="trial-list"></div><div id="diagram"></div><div id="transfer"></div><div class="feedback" id="feedback" role="status"></div><div class="task-actions"><button id="submit" class="primary">检验我的解释</button><button id="next" hidden class="primary">保存并进入下一站 →</button><button id="hint" class="subtle">给我一点提示</button></div><p id="hint-text" class="note" role="status"></p><button id="fresh" class="subtle">换一个尝试，重新检验</button></aside></div></section><section id="quiz-page" hidden></section><section id="end-page" hidden></section></main>
<dialog id="scene-photo-dialog" class="scene-photo-dialog" aria-label="放大的情境示意图"><button id="scene-photo-close" type="button">返回操作同屏 ×</button><img id="scene-photo-large" alt=""><p id="scene-photo-caption"></p></dialog>
<div id="toast" class="toast" role="status" hidden></div><footer>用操作发现关系，用结果检验想法。时间与学习效果仍需课堂试用校准。</footer></body></html>
